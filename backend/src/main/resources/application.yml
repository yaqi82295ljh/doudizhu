server:
  port: 8080

spring:
  application:
    name: doudizhu
  # 本地开发用 local profile，从 application-local.yml（已被 .gitignore 排除）读取真实密码与密钥。
  # 未提供该文件时自动跳过，改用下面各处的环境变量注入。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:doudizhu}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    # 仓库内不保留真实密码，必须通过环境变量 DB_PASSWORD 或 application-local.yml 注入
    password: ${DB_PASSWORD:}
  data:
    redis:
      # 本地开发由 Docker 提供：容器 ddz-redis（镜像 redis:7-alpine）
      # 启动方式：cd deploy && docker compose up -d redis
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

# 接口文档（springdoc 3.x + Swagger UI）
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 分组与接口统一按字母序，配合 @Tag 名称前缀（"00. 健康检查"）可固定排序
    tags-sorter: alpha
    operations-sorter: alpha
    # UI 上直接显示每个请求的耗时，联调性能问题时有据可查
    display-request-duration: true
  default-produces-media-type: application/json

ddz:
  game:
    bid-timeout-seconds: 15
    play-timeout-seconds: 25
    trust-timeout-seconds: 30
  llm:
    # M4 阶段开启；关闭时 AI 完全走本地引擎
    enabled: false
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    # 仓库内不保留真实密钥，必须通过环境变量 LLM_API_KEY 或 application-local.yml 注入
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-flash}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
    cache-ttl-seconds: 3600
    max-tokens: 150

logging:
  level:
    com.ddz: debug
